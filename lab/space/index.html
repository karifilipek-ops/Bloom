    @font-face {

    :root {

      --text: #f4f4f5;
      --muted: #9a9b9f;
      --dim: #77787c;
      --panel: #17191a;         /* neutral greys for the menu, so it isn't purple on purple */
      --panel-edge: #434547;
      --panel-lip: #050709;
      --track: #0e1011;
      --tab: #34363a;
      --tab-lip: #0a0b0c;
      --tile: #27292d;
      --tile-edge: #37393d;
      --tile-hover: #4b4d52;
      --tile-lip: #0c0c0c;
      --arrow: #818183;
      --icon: #c2c2c4;
      --accent: #b9a9ee;
      --accent-edge: #cdbffa;
      --accent-lip: #8d76bd;
      --accent-ink: #0d0614;
      --fs-xs: 16.667px;
      --fs-s: 20px;
      --fs-m: 22px;
      --fs-l: 25px;
      --fs-xl: 41.667px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "VT323", "Courier New", monospace;
      font-size: var(--fs-m);
      line-height: 1.1;
      -webkit-tap-highlight-color: transparent;
    }
    html.loading body { opacity: 0; }
    body { transition: opacity .35s ease; }

    #sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100lvh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top)) 24px 0;
    }

    .brand { text-align: center; }
    .brand h1 {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 svg { flex: none; display: block; margin-top: -2px; }
    .brand .io { color: var(--muted); }
    .brand p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: var(--fs-s);
      line-height: 1;
    }

    .panel {
      margin-top: 44px;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 18px;
      padding: 22px 18px 20px;
      box-shadow: 0 5px 0 var(--panel-lip);
    }
    .ph {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .ph h2 {
      margin: 0;
      font-size: var(--fs-l);
      font-weight: 400;
      line-height: 1;
    }
    .sq {
      width: 10px;
      height: 10px;
      background: var(--accent);
      box-shadow: 3px 3px 0 var(--accent-lip);
      margin: -4px 3px 0 0;
      flex: none;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 16px 0 16px;
      padding: 4px;
      background: var(--track);
      border-radius: 11px;
    }
    .tab {
      flex: 1 1 0;
      appearance: none;
      border: 0;
      margin: 0;
      padding: 7px 2px 6px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: var(--fs-s);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] {
      background: var(--tab);
      color: var(--text);
      box-shadow: 0 3px 0 var(--tab-lip);
    }
    .tab:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-bottom: 4px;
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 70px;
      padding: 34px 11px 12px;
      border-radius: 12px;
      background: var(--tile);
      border: 1px solid var(--tile-edge);
      box-shadow: 0 4px 0 var(--tile-lip);
      color: var(--text);
      text-decoration: none;
      font-size: var(--fs-m);
      line-height: 1;
      transition: transform .08s ease, box-shadow .08s ease, border-color .15s;

    .tile .ic { position: absolute; top: 11px; right: 11px; color: var(--icon); display: block; }
    .tile:hover { border-color: var(--tile-hover); }
    .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-lip); }
    .tile.hot {

    .tile.hot .ar, .tile.hot .ic { color: var(--accent-ink); }
    .tile.hot:active { box-shadow: 0 1px 0 var(--accent-lip); }
    .tile[hidden] { display: none; }

    .foot {

    .site-footer { position: relative; z-index: 1; text-align: center; padding: 34px 16px 40px; }

  <script>
  // Tabs: filter the tiles.
  (function () {
    var tabs = document.querySelectorAll(".tab");
    var tiles = document.querySelectorAll(".tile");
    tabs.forEach(function (t) {
      t.addEventListener("click", function () {
        var f = t.getAttribute("data-f");
        tabs.forEach(function (o) { o.setAttribute("aria-selected", o === t ? "true" : "false"); });
        tiles.forEach(function (el) { el.hidden = f !== "all" && el.getAttribute("data-c") !== f; });
      });
    });
  })();

  // Pixel starfield. Every star sits on a 2px art grid; stars twinkle by stepping
  // between a few fixed brightness levels (no smooth glow), a few "+" sparkles
  // grow and shrink their arms, and three depth layers drift at different speeds
  // when you scroll, so the sky reads as one continuous place behind the page.
  (function () {
    var cv = document.getElementById("sky");
    var cx = cv.getContext("2d", { alpha: false });
    var P = 2;                     // CSS px per art pixel
    var TW = 1100, TH = 900;       // the star field repeats every TW x TH art pixels (2200 x 1800 CSS px)
    var BG = [16, 8, 20];
    var GRID = [12, 6, 15];
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var seed = 1127;
    function rnd() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function mix(c, k) { // blend colour c toward the background, k = 1 full colour
      return "rgb(" + Math.round(BG[0] + (c[0] - BG[0]) * k) + "," + Math.round(BG[1] + (c[1] - BG[1]) * k) + "," + Math.round(BG[2] + (c[2] - BG[2]) * k) + ")";
    }
    function shades(c) { return [mix(c, 1), mix(c, .62), mix(c, .34), mix(c, .16)]; }

    // star colours sampled from the reference: white, pale pink, pale yellow, ice blue, blue grey, dusty mauve, grey
    var BRIGHT = [[244, 241, 248], [236, 172, 198], [247, 228, 170], [150, 186, 236]];
    var DIM = [[110, 130, 168], [124, 88, 116], [100, 94, 118], [80, 70, 98]];
    var B = BRIGHT.map(shades), D = DIM.map(shades);
    function pick(arr, w) { var r = rnd() * w.reduce(function (a, b) { return a + b; }), i = 0; while ((r -= w[i]) > 0) i++; return arr[i]; }

    // three layers: far (many dim stars, barely move), mid, near (brighter, sparkles)
    var LAYERS = [
      { speed: .08, n: 1500, bright: .14 },
      { speed: .2,  n: 850,  bright: .45 },
      { speed: .38, n: 420,  bright: .8  }
    ];
    LAYERS.forEach(function (L) {
      L.stars = [];
      for (var i = 0; i < L.n; i++) {
        var br = rnd() < L.bright;
        var s = {
          x: Math.floor(rnd() * TW),
          y: Math.floor(rnd() * TH),
          c: br ? pick(B, [5, 2, 2, 3]) : pick(D, [3, 2, 3, 3]),
          tw: rnd() < (br ? .55 : .3) ? 2400 + rnd() * 5200 : 0,
          ph: rnd() * 8000,
          base: br ? 0 : (rnd() < .5 ? 1 : 0)
        };
        if (br && rnd() < .1) s.d = pick(B, [2, 3, 1, 2]); // a few side-by-side double stars
        L.stars.push(s);
      }
      L.sparks = [];
    });
    // plus-shaped sparkles live on the mid and near layers
    var SPARK = [[255, 247, 226], [214, 228, 255], [255, 222, 236]];
    [1, 2].forEach(function (li) {
      for (var i = 0; i < (li === 1 ? 22 : 16); i++) {
        var col = SPARK[Math.floor(rnd() * SPARK.length)];
        LAYERS[li].sparks.push({
          x: 3 + Math.floor(rnd() * (TW - 6)),
          y: 3 + Math.floor(rnd() * (TH - 6)),
          s: shades(col),
          per: 3200 + rnd() * 4200,
          ph: rnd() * 7000,
          big: li === 2 && rnd() < .6
        });
      }
    });

    // brightness level for a twinkling star: mostly full, with a short stepped dip
    function level(s, t) {
      if (!s.tw || still) return s.base;
      var u = ((t + s.ph) % s.tw) / s.tw;
      if (u < .05) return Math.min(3, s.base + 1);
      if (u < .11) return Math.min(3, s.base + 2);
      if (u < .16) return Math.min(3, s.base + 1);
      return s.base;
    }
    // arm length + centre shade for a sparkle over its cycle
    var ARM = [1, 2, 2, 2, 1];
    function sparkState(k, t) {
      if (still) return [1, 0];
      var u = ((t + k.ph) % k.per) / k.per;
      if (u < .25) { var a = ARM[Math.floor(u / .05)]; return [k.big ? a : Math.min(a, 1), 0]; }
      return [k.big ? 1 : 0, u > .6 ? 1 : 0];
    }

    var W = 0, H = 0, dpr = 1, cols = 0, rows = 0, cell = 2, gridPat = null;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      var w = cv.clientWidth, h = cv.clientHeight;
      var nw = Math.round(w * dpr), nh = Math.round(h * dpr);
      if (nw === W && nh === H) return false;
      W = cv.width = nw; H = cv.height = nh;
      cell = P * dpr;
      cols = Math.ceil(w / P) + 1; rows = Math.ceil(h / P) + 1;
      // faint pixel grid like the reference (only where a cell is at least 4 device px)
      gridPat = null;
      var c = Math.round(cell);
      if (c >= 4 && Math.abs(c - cell) < .01) {
        var g = document.createElement("canvas"); g.width = g.height = c;
        var gx = g.getContext("2d");
        gx.fillStyle = "rgb(" + BG + ")"; gx.fillRect(0, 0, c, c);
        gx.fillStyle = "rgb(" + GRID + ")"; gx.fillRect(c - 1, 0, 1, c); gx.fillRect(0, c - 1, c, 1);
        gridPat = cx.createPattern(g, "repeat");
      }
      return true;
    }
    function px(x, y) { // art pixel -> device rect, snapped so neighbours never gap or overlap
      var x0 = Math.round(x * cell), y0 = Math.round(y * cell);
      cx.fillRect(x0, y0, Math.round((x + 1) * cell) - x0, Math.round((y + 1) * cell) - y0);
    }
    function mod(a, n) { return ((a % n) + n) % n; }

    // keep stars out from behind the title + tagline so none lands on a letter or reads as punctuation
    var clears = [], holes = [], dirty = true;
    function measure() {
      var sy = window.scrollY || 0;
      clears = [].map.call(document.querySelectorAll("[data-clear], .site-footer .by-wrap"), function (el) {
        var r = el.getBoundingClientRect();
        return [r.left, r.top + sy, r.right, r.bottom + sy];
      });
      dirty = true;
    }
    function blocked(x, y) {
      for (var i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (x >= h[0] && x <= h[2] && y >= h[1] && y <= h[3]) return true;
      }
      return false;
    }

    function draw(t) {
      cx.fillStyle = gridPat || "rgb(" + BG + ")";
      cx.fillRect(0, 0, W, H);
      var sy = window.scrollY || 0;
      holes = clears.map(function (c) {
        return [Math.floor(c[0] / P) - 2, Math.floor((c[1] - sy) / P) - 1, Math.ceil(c[2] / P) + 1, Math.ceil((c[3] - sy) / P)];
      });
      for (var li = 0; li < LAYERS.length; li++) {
        var L = LAYERS[li];
        var oy = Math.round(sy * L.speed / P);
        var i, s, x, y, k;
        for (i = 0; i < L.stars.length; i++) {
          s = L.stars[i];
          var lv = -1;
          for (x = s.x, k = 0; x < cols; x += TW, k++) {
            y = mod(s.y - oy + k * 377, TH);   // copies past 2200px wide shift down so they never line up
            if (y >= rows || blocked(x, y)) continue;
            if (lv < 0) lv = level(s, t);
            cx.fillStyle = s.c[lv]; px(x, y);
            if (s.d) { cx.fillStyle = s.d[Math.min(3, lv + 1)]; px(x + 1, y); }
          }
        }
        for (i = 0; i < L.sparks.length; i++) {
          k = L.sparks[i];
          y = mod(k.y - oy, TH);
          if (y >= rows + 3) continue;
          var st = sparkState(k, t), arm = st[0];
          for (x = k.x; x < cols + 3; x += TW) {
            if (blocked(x - 2, y) || blocked(x + 2, y) || blocked(x, y - 2) || blocked(x, y + 2)) continue;
            if (arm >= 1) {
              cx.fillStyle = k.s[arm >= 2 ? 1 : 2];
              px(x - 1, y); px(x + 1, y); px(x, y - 1); px(x, y + 1);
            }
            if (arm >= 2) {
              cx.fillStyle = k.s[3];
              px(x - 2, y); px(x + 2, y); px(x, y - 2); px(x, y + 2);
            }
            cx.fillStyle = k.s[st[1]]; px(x, y);
          }
        }
      }
    }

    var lastStep = -1, lastY = -1;
    function frame(now) {
      var step = still ? 0 : Math.floor(now / 110);   // twinkles move in ~9 steps a second, like sprite frames
      var y = window.scrollY || 0;
      if (dirty || step !== lastStep || y !== lastY) {
        lastStep = step; lastY = y; dirty = false;
        draw(step * 110);
      }
      requestAnimationFrame(frame);
    }
    size();
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    window.addEventListener("load", measure);
    window.addEventListener("resize", function () { size(); measure(); });
    requestAnimationFrame(frame);
  })();
  </script>
  <script src="/assets/js/layout.js"></script>
</body>
</html>
